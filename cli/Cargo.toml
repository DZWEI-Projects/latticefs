[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lfs"
path = "src/main.rs"

[dependencies]
latticefs-base = { package = "base", path = "../base" }
clap = { version = "4.5", features = ["derive", "env", "color"] }
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
similar = "2.4"
walkdir = "2.5"
uuid = { version = "1", features = ["v4", "v7"] }
dirs = "5.0"
hex = "0.4"
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
