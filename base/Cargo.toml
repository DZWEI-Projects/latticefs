[package]
name = "base"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
blake3 = "1"
uuid = { version = "1", features = ["v7", "serde"] }
sled = "0.34"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
bincode = "1"
hex = "0.4"
fastcdc = "3"

[dev-dependencies]
proptest = "1"
tempfile = "3"
