[package]
name = "base"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
blake3 = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sled = "0.34"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
bincode = "1"
hex = "0.4"
fastcdc = "3"
prost = "0.12"
bytes = "1"

# Phase 2: Crypto dependencies
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
keyring = "2.3"
rand = "0.8"
argon2 = "0.5"
base64 = "0.22"
bs58 = "0.5"
dirs = "5.0"
time = { version = "0.3", features = ["parsing", "formatting"] }

# Phase 3: Import/Export, FUSE, config
mime_guess = "2.0"
exif = { package = "kamadak-exif", version = "0.5" }
id3 = "1.13"
pdf-extract = "0.7"
lopdf = "0.33"
walkdir = "2.5"
toml = "0.8"
fuser = { version = "0.14", optional = true }
lru = "0.12"
tar = "0.4"
libc = "0.2"

[features]
default = []
fuse = ["fuser"]

[dev-dependencies]
proptest = "1"
tempfile = "3"

[build-dependencies]
prost-build = "0.12"
